name: build

# Самодостаточный workflow: весь код мода встроен в этот файл.
# Положите его в .github/workflows/build.yml репозитория и запустите (Actions -> build -> Run workflow).
# 36 дополнительных слотов прямо в экране инвентаря (справа от панели). Режима редактирования больше нет.
# Версии Fabric Loader / Loom / Fabric API определяются автоматически (с запасными значениями).

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve Fabric versions
        run: |
          MAVEN=https://maven.fabricmc.net/net/fabricmc
          LOADER=$(curl -fsSL "$MAVEN/fabric-loader/maven-metadata.xml" | grep -oP '(?<=<release>)[^<]+' || true)
          LOOM=$(curl -fsSL "$MAVEN/fabric-loom/net.fabricmc.fabric-loom.gradle.plugin/maven-metadata.xml" | grep -oP '(?<=<release>)[^<]+' || true)
          API=$(curl -fsSL "$MAVEN/fabric-api/fabric-api/maven-metadata.xml" | grep -oP '(?<=<version>)[^<]+\+26\.2(?=</version>)' | tail -1 || true)
          [ -n "$LOADER" ] || LOADER=0.19.5
          [ -n "$LOOM" ] || LOOM=1.18.4
          [ -n "$API" ] || API=0.161.0+26.2
          echo "Loader=$LOADER Loom=$LOOM FabricAPI=$API"
          echo "LOADER_VERSION=$LOADER" >> "$GITHUB_ENV"
          echo "LOOM_VERSION=$LOOM" >> "$GITHUB_ENV"
          echo "FABRIC_API_VERSION=$API" >> "$GITHUB_ENV"

      - name: Generate mod project
        run: |
          cat > 'gradle.properties' <<BIGSLOTS_EOF
          org.gradle.jvmargs=-Xmx2G
          org.gradle.parallel=true
          org.gradle.configuration-cache=false

          # Fabric (https://fabricmc.net/develop)
          minecraft_version=26.2
          loader_version=${LOADER_VERSION}
          loom_version=${LOOM_VERSION}
          fabric_api_version=${FABRIC_API_VERSION}

          # Мод
          mod_version=2.1.0
          maven_group=com.bigslots
          archives_base_name=bigslots
          BIGSLOTS_EOF
          cat > 'settings.gradle' <<'BIGSLOTS_EOF'
          pluginManagement {
              repositories {
                  maven {
                      name = 'Fabric'
                      url = 'https://maven.fabricmc.net/'
                  }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          BIGSLOTS_EOF
          cat > 'build.gradle' <<'BIGSLOTS_EOF'
          plugins {
              id 'net.fabricmc.fabric-loom' version "${loom_version}"
              id 'maven-publish'
          }

          version = project.mod_version
          group = project.maven_group

          base {
              archivesName = project.archives_base_name
          }

          repositories {
          }

          loom {
              splitEnvironmentSourceSets()

              mods {
                  "bigslots" {
                      sourceSet sourceSets.main
                      sourceSet sourceSets.client
                  }
              }
          }

          dependencies {
              // Minecraft 26.x не обфусцирован: маппинги и remap не нужны
              minecraft "com.mojang:minecraft:${project.minecraft_version}"
              implementation "net.fabricmc:fabric-loader:${project.loader_version}"
              implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
          }

          processResources {
              inputs.property "version", project.version

              filesMatching("fabric.mod.json") {
                  expand "version": inputs.properties.version
              }
          }

          tasks.withType(JavaCompile).configureEach {
              it.options.release = 25
              it.options.encoding = "UTF-8"
          }

          java {
              withSourcesJar()
              sourceCompatibility = JavaVersion.VERSION_25
              targetCompatibility = JavaVersion.VERSION_25
          }
          BIGSLOTS_EOF
          mkdir -p 'src/main/java/com/bigslots'
          cat > 'src/main/java/com/bigslots/BigSlotsPlayer.java' <<'BIGSLOTS_EOF'
          package com.bigslots;

          import net.minecraft.world.SimpleContainer;

          /** Дополнительные данные игрока (реализуется миксином на Player). */
          public interface BigSlotsPlayer {
              /** Контейнер дополнительных слотов. */
              SimpleContainer bigslots$getExtra();
          }
          BIGSLOTS_EOF
          cat > 'src/main/java/com/bigslots/ExtraSlot.java' <<'BIGSLOTS_EOF'
          package com.bigslots;

          import net.minecraft.world.Container;
          import net.minecraft.world.inventory.Slot;

          /** Дополнительный слот инвентаря (отдельный класс, чтобы клиент мог нарисовать рамку и не считать клик по нему "мимо"). */
          public class ExtraSlot extends Slot {
              public ExtraSlot(Container container, int index, int x, int y) {
                  super(container, index, x, y);
              }
          }
          BIGSLOTS_EOF
          cat > 'src/main/java/com/bigslots/BigSlots.java' <<'BIGSLOTS_EOF'
          package com.bigslots;

          import net.fabricmc.api.ModInitializer;
          import net.minecraft.resources.Identifier;

          public class BigSlots implements ModInitializer {
              public static final String MOD_ID = "bigslots";

              /** Дополнительные слоты: 9 строк по 4 колонки справа от инвентаря. */
              public static final int EXTRA_ROWS = 9;
              public static final int EXTRA_COLS = 4;
              public static final int EXTRA = EXTRA_ROWS * EXTRA_COLS;

              public static Identifier id(String path) {
                  return Identifier.fromNamespaceAndPath(MOD_ID, path);
              }

              @Override
              public void onInitialize() {
                  // вся логика - в миксинах
              }
          }
          BIGSLOTS_EOF
          mkdir -p 'src/main/java/com/bigslots/mixin'
          cat > 'src/main/java/com/bigslots/mixin/PlayerMixin.java' <<'BIGSLOTS_EOF'
          package com.bigslots.mixin;

          import com.bigslots.BigSlots;
          import com.bigslots.BigSlotsPlayer;
          import net.minecraft.world.ItemStackWithSlot;
          import net.minecraft.world.SimpleContainer;
          import net.minecraft.world.entity.player.Player;
          import net.minecraft.world.item.ItemStack;
          import net.minecraft.world.level.storage.ValueInput;
          import net.minecraft.world.level.storage.ValueOutput;
          import org.spongepowered.asm.mixin.Mixin;
          import org.spongepowered.asm.mixin.Unique;
          import org.spongepowered.asm.mixin.injection.At;
          import org.spongepowered.asm.mixin.injection.Inject;
          import org.spongepowered.asm.mixin.injection.callback.CallbackInfo;

          /** Хранит у игрока контейнер доп. слотов и сохраняет его вместе с данными игрока. */
          @Mixin(Player.class)
          public abstract class PlayerMixin implements BigSlotsPlayer {
              @Unique
              private SimpleContainer bigslots$extra;

              @Override
              public SimpleContainer bigslots$getExtra() {
                  // лениво: меню инвентаря создаётся в конструкторе Player раньше, чем отработали бы инициализаторы
                  if (this.bigslots$extra == null) {
                      this.bigslots$extra = new SimpleContainer(BigSlots.EXTRA);
                  }
                  return this.bigslots$extra;
              }

              @Inject(method = "addAdditionalSaveData(Lnet/minecraft/world/level/storage/ValueOutput;)V", at = @At("TAIL"))
              private void bigslots$save(ValueOutput output, CallbackInfo ci) {
                  SimpleContainer extra = this.bigslots$getExtra();
                  var list = output.list("BigSlotsItems", ItemStackWithSlot.CODEC);
                  for (int i = 0; i < extra.getContainerSize(); i++) {
                      ItemStack stack = extra.getItem(i);
                      if (!stack.isEmpty()) {
                          list.add(new ItemStackWithSlot(i, stack));
                      }
                  }
              }

              @Inject(method = "readAdditionalSaveData(Lnet/minecraft/world/level/storage/ValueInput;)V", at = @At("TAIL"))
              private void bigslots$load(ValueInput input, CallbackInfo ci) {
                  SimpleContainer extra = this.bigslots$getExtra();
                  for (var entry : input.listOrEmpty("BigSlotsItems", ItemStackWithSlot.CODEC)) {
                      int slot = entry.slot();
                      if (slot >= 0 && slot < extra.getContainerSize()) {
                          extra.setItem(slot, entry.stack());
                      }
                  }
              }
          }
          BIGSLOTS_EOF
          cat > 'src/main/java/com/bigslots/mixin/InventoryMixin.java' <<'BIGSLOTS_EOF'
          package com.bigslots.mixin;

          import com.bigslots.BigSlotsPlayer;
          import net.minecraft.world.SimpleContainer;
          import net.minecraft.world.entity.player.Inventory;
          import net.minecraft.world.entity.player.Player;
          import net.minecraft.world.item.ItemStack;
          import org.spongepowered.asm.mixin.Final;
          import org.spongepowered.asm.mixin.Mixin;
          import org.spongepowered.asm.mixin.Shadow;
          import org.spongepowered.asm.mixin.injection.At;
          import org.spongepowered.asm.mixin.injection.Inject;
          import org.spongepowered.asm.mixin.injection.callback.CallbackInfo;

          /** При смерти (без keepInventory) предметы из доп. слотов выпадают вместе с обычными. */
          @Mixin(Inventory.class)
          public abstract class InventoryMixin {
              @Shadow
              @Final
              public Player player;

              @Inject(method = "dropAll()V", at = @At("HEAD"))
              private void bigslots$dropExtra(CallbackInfo ci) {
                  if (this.player.level().isClientSide()) {
                      return;
                  }
                  if (this.player instanceof BigSlotsPlayer bp) {
                      SimpleContainer extra = bp.bigslots$getExtra();
                      for (int i = 0; i < extra.getContainerSize(); i++) {
                          ItemStack stack = extra.getItem(i);
                          if (!stack.isEmpty()) {
                              this.player.drop(stack, true);
                              extra.setItem(i, ItemStack.EMPTY);
                          }
                      }
                  }
              }
          }
          BIGSLOTS_EOF
          cat > 'src/main/java/com/bigslots/mixin/InventoryMenuMixin.java' <<'BIGSLOTS_EOF'
          package com.bigslots.mixin;

          import com.bigslots.BigSlots;
          import com.bigslots.BigSlotsPlayer;
          import com.bigslots.ExtraSlot;
          import net.minecraft.world.SimpleContainer;
          import net.minecraft.world.entity.player.Inventory;
          import net.minecraft.world.entity.player.Player;
          import net.minecraft.world.inventory.AbstractContainerMenu;
          import net.minecraft.world.inventory.InventoryMenu;
          import net.minecraft.world.inventory.MenuType;
          import org.spongepowered.asm.mixin.Mixin;
          import org.spongepowered.asm.mixin.injection.At;
          import org.spongepowered.asm.mixin.injection.Inject;
          import org.spongepowered.asm.mixin.injection.callback.CallbackInfo;

          /** Добавляет дополнительные слоты в конец меню инвентаря игрока (индексы после ванильных, поэтому ваниль не ломается). */
          @Mixin(InventoryMenu.class)
          public abstract class InventoryMenuMixin extends AbstractContainerMenu {
              protected InventoryMenuMixin(MenuType<?> menuType, int containerId) {
                  super(menuType, containerId);
              }

              @Inject(method = "<init>(Lnet/minecraft/world/entity/player/Inventory;ZLnet/minecraft/world/entity/player/Player;)V",
                      at = @At("TAIL"))
              private void bigslots$addSlots(Inventory inventory, boolean active, Player owner, CallbackInfo ci) {
                  if (!(owner instanceof BigSlotsPlayer bp)) {
                      return;
                  }
                  SimpleContainer extra = bp.bigslots$getExtra();
                  for (int i = 0; i < BigSlots.EXTRA; i++) {
                      int col = i % BigSlots.EXTRA_COLS;
                      int row = i / BigSlots.EXTRA_COLS;
                      // справа от панели инвентаря (ширина панели 176)
                      this.addSlot(new ExtraSlot(extra, i, 182 + col * 18, 8 + row * 18));
                  }
              }
          }
          BIGSLOTS_EOF
          cat > 'src/main/java/com/bigslots/mixin/ServerPlayerMixin.java' <<'BIGSLOTS_EOF'
          package com.bigslots.mixin;

          import com.bigslots.BigSlotsPlayer;
          import net.minecraft.server.level.ServerPlayer;
          import net.minecraft.world.SimpleContainer;
          import org.spongepowered.asm.mixin.Mixin;
          import org.spongepowered.asm.mixin.injection.At;
          import org.spongepowered.asm.mixin.injection.Inject;
          import org.spongepowered.asm.mixin.injection.callback.CallbackInfo;

          /** При возрождении/смене экземпляра игрока переносим содержимое доп. слотов. */
          @Mixin(ServerPlayer.class)
          public abstract class ServerPlayerMixin {
              @Inject(method = "restoreFrom(Lnet/minecraft/server/level/ServerPlayer;Z)V", at = @At("TAIL"), require = 0)
              private void bigslots$copy(ServerPlayer old, boolean alive, CallbackInfo ci) {
                  if (old instanceof BigSlotsPlayer from && (Object) this instanceof BigSlotsPlayer to) {
                      SimpleContainer a = from.bigslots$getExtra();
                      SimpleContainer b = to.bigslots$getExtra();
                      for (int i = 0; i < a.getContainerSize() && i < b.getContainerSize(); i++) {
                          b.setItem(i, a.getItem(i));
                      }
                  }
              }
          }
          BIGSLOTS_EOF
          mkdir -p 'src/client/java/com/bigslots/mixin'
          cat > 'src/client/java/com/bigslots/mixin/AbstractContainerScreenMixin.java' <<'BIGSLOTS_EOF'
          package com.bigslots.mixin;

          import com.bigslots.ExtraSlot;
          import net.minecraft.client.gui.GuiGraphicsExtractor;
          import net.minecraft.client.gui.screens.inventory.AbstractContainerScreen;
          import net.minecraft.world.inventory.Slot;
          import org.spongepowered.asm.mixin.Mixin;
          import org.spongepowered.asm.mixin.Unique;
          import org.spongepowered.asm.mixin.injection.At;
          import org.spongepowered.asm.mixin.injection.Inject;
          import org.spongepowered.asm.mixin.injection.callback.CallbackInfo;
          import org.spongepowered.asm.mixin.injection.callback.CallbackInfoReturnable;

          /**
           * Клиентская часть.
           * 1) Слоты стоят справа от панели инвентаря, то есть вне её границ. Ванильный экран считает такой клик
           *    "мимо окна" (slotId = -999): предмет в руке выбрасывается, а взять предмет из слота нельзя.
           *    Поэтому для клика по нашему слоту говорим, что клик НЕ вне окна.
           * 2) Рисуем рамку под каждым доп. слотом.
           *
           * Цели указаны с полными дескрипторами и require = 0: если сигнатура в 26.2 другая, мод не падает,
           * просто соответствующая часть не сработает. Для каждого метода есть по два вероятных варианта сигнатуры.
           */
          @Mixin(AbstractContainerScreen.class)
          public abstract class AbstractContainerScreenMixin {

              @Unique
              private boolean bigslots$overExtra(double mouseX, double mouseY, int guiLeft, int guiTop) {
                  AbstractContainerScreen<?> screen = (AbstractContainerScreen<?>) (Object) this;
                  double mx = mouseX - guiLeft;
                  double my = mouseY - guiTop;
                  for (Slot slot : screen.getMenu().slots) {
                      if (slot instanceof ExtraSlot
                              && mx >= slot.x - 1 && mx < slot.x + 17
                              && my >= slot.y - 1 && my < slot.y + 17) {
                          return true;
                      }
                  }
                  return false;
              }

              @Inject(method = "hasClickedOutside(DDII)Z", at = @At("HEAD"), cancellable = true, require = 0)
              private void bigslots$outside4(double mouseX, double mouseY, int guiLeft, int guiTop,
                                             CallbackInfoReturnable<Boolean> cir) {
                  if (bigslots$overExtra(mouseX, mouseY, guiLeft, guiTop)) {
                      cir.setReturnValue(false);
                  }
              }

              @Inject(method = "hasClickedOutside(DDIII)Z", at = @At("HEAD"), cancellable = true, require = 0)
              private void bigslots$outside5(double mouseX, double mouseY, int guiLeft, int guiTop, int button,
                                             CallbackInfoReturnable<Boolean> cir) {
                  if (bigslots$overExtra(mouseX, mouseY, guiLeft, guiTop)) {
                      cir.setReturnValue(false);
                  }
              }

              @Unique
              private static void bigslots$frame(GuiGraphicsExtractor graphics, Slot slot) {
                  if (slot instanceof ExtraSlot) {
                      int x = slot.x;
                      int y = slot.y;
                      graphics.fill(x - 1, y - 1, x + 17, y + 17, 0xFF373737);
                      graphics.fill(x, y, x + 16, y + 16, 0xFF8B8B8B);
                  }
              }

              @Inject(method = "extractSlot(Lnet/minecraft/client/gui/GuiGraphicsExtractor;Lnet/minecraft/world/inventory/Slot;II)V",
                      at = @At("HEAD"), require = 0)
              private void bigslots$frame4(GuiGraphicsExtractor graphics, Slot slot, int mouseX, int mouseY, CallbackInfo ci) {
                  bigslots$frame(graphics, slot);
              }

              @Inject(method = "extractSlot(Lnet/minecraft/client/gui/GuiGraphicsExtractor;Lnet/minecraft/world/inventory/Slot;)V",
                      at = @At("HEAD"), require = 0)
              private void bigslots$frame2(GuiGraphicsExtractor graphics, Slot slot, CallbackInfo ci) {
                  bigslots$frame(graphics, slot);
              }
          }
          BIGSLOTS_EOF
          mkdir -p 'src/main/resources'
          cat > 'src/main/resources/bigslots.mixins.json' <<'BIGSLOTS_EOF'
          {
            "required": true,
            "minVersion": "0.8",
            "package": "com.bigslots.mixin",
            "compatibilityLevel": "JAVA_25",
            "mixins": [
              "PlayerMixin",
              "InventoryMixin",
              "InventoryMenuMixin",
              "ServerPlayerMixin"
            ],
            "client": [
              "AbstractContainerScreenMixin"
            ],
            "injectors": {
              "defaultRequire": 1
            }
          }
          BIGSLOTS_EOF
          cat > 'src/main/resources/fabric.mod.json' <<'BIGSLOTS_EOF'
          {
            "schemaVersion": 1,
            "id": "bigslots",
            "version": "${version}",
            "name": "Big Slots",
            "description": "Больше слотов в инвентаре без дополнительных предметов.",
            "authors": [],
            "license": "MIT",
            "environment": "*",
            "entrypoints": {
              "main": [
                "com.bigslots.BigSlots"
              ]
            },
            "mixins": [
              "bigslots.mixins.json"
            ],
            "depends": {
              "fabricloader": ">=0.19.3",
              "minecraft": "~26.2",
              "java": ">=25",
              "fabric-api": "*"
            }
          }
          BIGSLOTS_EOF

      - name: Build
        run: gradle build --stacktrace

      # Диагностика: реальные сигнатуры классов Minecraft 26.2 (серверные и клиентские).
      # Нужна, чтобы доработки (хотбар, рамки) писались по фактам. Результат: артефакт "signatures".
      - name: Dump Minecraft class signatures
        if: always()
        run: |
          CP=""
          for j in $(find "$HOME/.gradle" "$GITHUB_WORKSPACE/.gradle" -name '*.jar' -size +5M 2>/dev/null); do
            if unzip -l "$j" 2>/dev/null | grep -q -E 'net/minecraft/(world/entity/player/Inventory|client/gui/screens/inventory/InventoryScreen)\.class'; then
              CP="$CP:$j"
            fi
          done
          CP="${CP#:}"
          dump() { echo "===== $1"; javap -p -cp "$CP" "$1" 2>&1; }
          dumpf() { echo "===== $1 (filtered: $2)"; javap -p -cp "$CP" "$1" 2>&1 | grep -E "$2" || true; }
          {
            echo "Classpath: $CP"
            echo "===== class names"
            for j in ${CP//:/ }; do
              unzip -l "$j" | grep -i -E 'Hotbar|/Gui\.class|gui/contextualbar|InventoryScreen|AbstractContainerScreen|KeyEvent' | awk '{print $4}'
            done
            dump net.minecraft.client.gui.screens.inventory.AbstractContainerScreen
            dump net.minecraft.client.gui.screens.inventory.InventoryScreen
            dump net.minecraft.client.gui.Gui
            dumpf net.minecraft.server.level.ServerPlayer 'restoreFrom|inventoryMenu|containerMenu'
          } 2>&1 | tee signatures.txt

      - name: Upload signatures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signatures
          path: signatures.txt
          if-no-files-found: ignore

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: bigslots
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar

      # При пуше тега вида v1.0.0 jar прикрепляется к GitHub Release
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/libs/*.jar
            !build/libs/*-sources.jar
