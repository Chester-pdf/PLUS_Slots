name: Build Big Bag

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Create project files
        run: |
          cat > build.gradle <<'EOF'
          plugins {
              id 'net.fabricmc.fabric-loom' version "${loom_version}"
              id 'maven-publish'
          }

          version = project.mod_version
          group = project.maven_group

          base {
              archivesName = project.archives_base_name
          }

          repositories {
              mavenCentral()
          }

          dependencies {
              minecraft "com.mojang:minecraft:${project.minecraft_version}"
              implementation "net.fabricmc:fabric-loader:${project.loader_version}"
              implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
          }

          processResources {
              inputs.property "version", project.version
              filesMatching("fabric.mod.json") {
                  expand "version": inputs.properties.version
              }
          }

          tasks.withType(JavaCompile).configureEach {
              it.options.release = 25
              it.options.encoding = 'UTF-8'
          }

          java {
              sourceCompatibility = JavaVersion.VERSION_25
              targetCompatibility = JavaVersion.VERSION_25
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3G
          org.gradle.parallel=true
          minecraft_version=26.2
          loader_version=0.19.3
          loom_version=1.17-SNAPSHOT
          fabric_version=0.152.1+26.2
          mod_version=0.1.0
          maven_group=com.bigbag
          archives_base_name=bigbag
          EOF

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  maven {
                      name = 'Fabric'
                      url = 'https://maven.fabricmc.net/'
                  }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          rootProject.name = 'bigbag'
          EOF

          mkdir -p src/main/java/com/bigbag
          cat > src/main/java/com/bigbag/BagData.java <<'EOF'
          package com.bigbag;

          import com.mojang.serialization.Codec;
          import com.mojang.serialization.codecs.RecordCodecBuilder;
          import java.util.ArrayList;
          import java.util.List;
          import net.minecraft.world.item.ItemStack;

          /** Immutable per-player data: contents of the extra slots and a bitmask of unlocked slots. */
          public record BagData(List<ItemStack> items, long unlocked) {
              public static final int SIZE = 54;
              /** How many extra slots a new player starts with (first 27 = 3 rows). */
              public static final long DEFAULT_UNLOCKED = (1L << 27) - 1L;

              public static final Codec<BagData> CODEC = RecordCodecBuilder.create(i -> i.group(
                      ItemStack.OPTIONAL_CODEC.listOf().fieldOf("items").forGetter(BagData::items),
                      Codec.LONG.fieldOf("unlocked").forGetter(BagData::unlocked)
              ).apply(i, BagData::new));

              public static BagData empty() {
                  List<ItemStack> list = new ArrayList<>(SIZE);
                  for (int k = 0; k < SIZE; k++) {
                      list.add(ItemStack.EMPTY);
                  }
                  return new BagData(list, DEFAULT_UNLOCKED);
              }
          }
          EOF

          mkdir -p src/main/java/com/bigbag
          cat > src/main/java/com/bigbag/BagMenu.java <<'EOF'
          package com.bigbag;

          import java.util.ArrayList;
          import java.util.List;
          import net.minecraft.server.level.ServerPlayer;
          import net.minecraft.world.Container;
          import net.minecraft.world.SimpleContainer;
          import net.minecraft.world.entity.player.Inventory;
          import net.minecraft.world.entity.player.Player;
          import net.minecraft.world.inventory.AbstractContainerMenu;
          import net.minecraft.world.inventory.SimpleContainerData;
          import net.minecraft.world.inventory.Slot;
          import net.minecraft.world.item.ItemStack;

          public class BagMenu extends AbstractContainerMenu {
              public static final int SIZE = BagData.SIZE;
              public static final int COLS = 9;
              private static final int PLAYER_SLOTS = 36;

              private final SimpleContainer container = new SimpleContainer(SIZE);
              /** 1 = slot unlocked, 0 = locked. Synced to the client automatically as menu data. */
              private final SimpleContainerData unlocked = new SimpleContainerData(SIZE);
              /** null on the client. */
              private final ServerPlayer owner;

              // Client-side constructor
              public BagMenu(int containerId, Inventory inventory) {
                  this(containerId, inventory, null);
              }

              // Server-side constructor
              public BagMenu(int containerId, Inventory inventory, ServerPlayer owner) {
                  super(BigBagMod.BAG_MENU, containerId);
                  this.owner = owner;

                  if (owner != null) {
                      BagData data = owner.getAttachedOrCreate(BigBagMod.BAG_DATA);
                      for (int i = 0; i < SIZE; i++) {
                          ItemStack stack = i < data.items().size() ? data.items().get(i) : ItemStack.EMPTY;
                          this.container.setItem(i, stack.copy());
                          this.unlocked.set(i, ((data.unlocked() >> i) & 1L) == 1L ? 1 : 0);
                      }
                      this.container.addListener(c -> this.save());
                  }

                  for (int row = 0; row < SIZE / COLS; row++) {
                      for (int col = 0; col < COLS; col++) {
                          int idx = row * COLS + col;
                          this.addSlot(new BagSlot(this.container, idx, 8 + col * 18, 18 + row * 18, this));
                      }
                  }
                  this.addStandardInventorySlots(inventory, 8, 140);
                  this.addDataSlots(this.unlocked);
              }

              public boolean isUnlocked(int index) {
                  return index >= 0 && index < SIZE && this.unlocked.get(index) == 1;
              }

              /** Server only: unlock or remove one slot. Items in a removed slot are dropped. */
              public void setUnlocked(int index, boolean on) {
                  if (this.owner == null || index < 0 || index >= SIZE) {
                      return;
                  }
                  if (isUnlocked(index) == on) {
                      return;
                  }
                  if (!on) {
                      ItemStack stack = this.container.getItem(index);
                      if (!stack.isEmpty()) {
                          this.container.setItem(index, ItemStack.EMPTY);
                          this.owner.drop(stack, false);
                      }
                  }
                  this.unlocked.set(index, on ? 1 : 0);
                  save();
              }

              private void save() {
                  if (this.owner == null) {
                      return;
                  }
                  List<ItemStack> list = new ArrayList<>(SIZE);
                  long mask = 0L;
                  for (int i = 0; i < SIZE; i++) {
                      list.add(this.container.getItem(i).copy());
                      if (this.unlocked.get(i) == 1) {
                          mask |= 1L << i;
                      }
                  }
                  this.owner.setAttached(BigBagMod.BAG_DATA, new BagData(list, mask));
              }

              @Override
              public ItemStack quickMoveStack(Player player, int slotIndex) {
                  Slot slot = this.slots.get(slotIndex);
                  if (!slot.hasItem()) {
                      return ItemStack.EMPTY;
                  }
                  ItemStack stack = slot.getItem();
                  ItemStack clicked = stack.copy();

                  if (slotIndex < SIZE) {
                      if (!this.moveItemStackTo(stack, SIZE, SIZE + PLAYER_SLOTS, true)) {
                          return ItemStack.EMPTY;
                      }
                  } else {
                      if (!this.moveItemStackTo(stack, 0, SIZE, false)) {
                          return ItemStack.EMPTY;
                      }
                  }

                  if (stack.isEmpty()) {
                      slot.setByPlayer(ItemStack.EMPTY);
                  } else {
                      slot.setChanged();
                  }
                  return clicked;
              }

              @Override
              public boolean stillValid(Player player) {
                  return true;
              }

              private static class BagSlot extends Slot {
                  private final BagMenu menu;
                  private final int index;

                  BagSlot(Container container, int index, int x, int y, BagMenu menu) {
                      super(container, index, x, y);
                      this.menu = menu;
                      this.index = index;
                  }

                  @Override
                  public boolean mayPlace(ItemStack stack) {
                      return this.menu.isUnlocked(this.index);
                  }

                  @Override
                  public boolean mayPickup(Player player) {
                      return this.menu.isUnlocked(this.index);
                  }
              }
          }
          EOF

          mkdir -p src/main/java/com/bigbag
          cat > src/main/java/com/bigbag/BigBagMod.java <<'EOF'
          package com.bigbag;

          import net.fabricmc.api.ModInitializer;
          import net.fabricmc.fabric.api.attachment.v1.AttachmentRegistry;
          import net.fabricmc.fabric.api.attachment.v1.AttachmentType;
          import net.fabricmc.fabric.api.networking.v1.PayloadTypeRegistry;
          import net.fabricmc.fabric.api.networking.v1.ServerPlayNetworking;
          import net.minecraft.core.Registry;
          import net.minecraft.core.registries.BuiltInRegistries;
          import net.minecraft.network.chat.Component;
          import net.minecraft.resources.Identifier;
          import net.minecraft.server.level.ServerPlayer;
          import net.minecraft.world.SimpleMenuProvider;
          import net.minecraft.world.flag.FeatureFlagSet;
          import net.minecraft.world.inventory.MenuType;

          public class BigBagMod implements ModInitializer {
              public static final String MOD_ID = "bigbag";

              public static Identifier id(String path) {
                  return Identifier.fromNamespaceAndPath(MOD_ID, path);
              }

              public static final AttachmentType<BagData> BAG_DATA = AttachmentRegistry.create(
                      id("bag"),
                      builder -> builder
                              .initializer(BagData::empty)
                              .persistent(BagData.CODEC)
                              .copyOnDeath()
              );

              public static MenuType<BagMenu> BAG_MENU;

              @Override
              public void onInitialize() {
                  BAG_MENU = Registry.register(
                          BuiltInRegistries.MENU,
                          id("bag"),
                          new MenuType<>(BagMenu::new, FeatureFlagSet.of())
                  );

                  PayloadTypeRegistry.serverboundPlay().register(OpenBagPayload.TYPE, OpenBagPayload.CODEC);
                  PayloadTypeRegistry.serverboundPlay().register(SlotEditPayload.TYPE, SlotEditPayload.CODEC);

                  ServerPlayNetworking.registerGlobalReceiver(OpenBagPayload.TYPE, (payload, context) -> {
                      ServerPlayer player = context.player();
                      player.openMenu(new SimpleMenuProvider(
                              (containerId, inventory, p) -> new BagMenu(containerId, inventory, player),
                              Component.translatable("container.bigbag.bag")
                      ));
                  });

                  ServerPlayNetworking.registerGlobalReceiver(SlotEditPayload.TYPE, (payload, context) -> {
                      if (context.player().containerMenu instanceof BagMenu menu) {
                          menu.setUnlocked(payload.slot(), payload.unlock());
                      }
                  });
              }
          }
          EOF

          mkdir -p src/main/java/com/bigbag
          cat > src/main/java/com/bigbag/OpenBagPayload.java <<'EOF'
          package com.bigbag;

          import net.minecraft.network.RegistryFriendlyByteBuf;
          import net.minecraft.network.codec.StreamCodec;
          import net.minecraft.network.protocol.common.custom.CustomPacketPayload;

          /** Client -> server: "open my bag". */
          public record OpenBagPayload() implements CustomPacketPayload {
              public static final CustomPacketPayload.Type<OpenBagPayload> TYPE =
                      new CustomPacketPayload.Type<>(BigBagMod.id("open_bag"));
              public static final StreamCodec<RegistryFriendlyByteBuf, OpenBagPayload> CODEC =
                      StreamCodec.unit(new OpenBagPayload());

              @Override
              public CustomPacketPayload.Type<? extends CustomPacketPayload> type() {
                  return TYPE;
              }
          }
          EOF

          mkdir -p src/main/java/com/bigbag
          cat > src/main/java/com/bigbag/SlotEditPayload.java <<'EOF'
          package com.bigbag;

          import net.minecraft.network.RegistryFriendlyByteBuf;
          import net.minecraft.network.codec.ByteBufCodecs;
          import net.minecraft.network.codec.StreamCodec;
          import net.minecraft.network.protocol.common.custom.CustomPacketPayload;

          /** Client -> server: unlock (LMB) or remove (RMB) one extra slot. */
          public record SlotEditPayload(int slot, boolean unlock) implements CustomPacketPayload {
              public static final CustomPacketPayload.Type<SlotEditPayload> TYPE =
                      new CustomPacketPayload.Type<>(BigBagMod.id("slot_edit"));
              public static final StreamCodec<RegistryFriendlyByteBuf, SlotEditPayload> CODEC = StreamCodec.composite(
                      ByteBufCodecs.VAR_INT, SlotEditPayload::slot,
                      ByteBufCodecs.BOOL, SlotEditPayload::unlock,
                      SlotEditPayload::new
              );

              @Override
              public CustomPacketPayload.Type<? extends CustomPacketPayload> type() {
                  return TYPE;
              }
          }
          EOF

          mkdir -p src/main/java/com/bigbag/client
          cat > src/main/java/com/bigbag/client/BagScreen.java <<'EOF'
          package com.bigbag.client;

          import com.bigbag.BagMenu;
          import com.bigbag.SlotEditPayload;
          import net.fabricmc.fabric.api.client.networking.v1.ClientPlayNetworking;
          import net.minecraft.client.gui.GuiGraphicsExtractor;
          import net.minecraft.client.gui.screens.inventory.AbstractContainerScreen;
          import net.minecraft.client.input.KeyEvent;
          import net.minecraft.client.input.MouseButtonEvent;
          import net.minecraft.network.chat.Component;
          import net.minecraft.world.entity.player.Inventory;
          import net.minecraft.world.inventory.Slot;

          public class BagScreen extends AbstractContainerScreen<BagMenu> {
              private static final int KEY_ESCAPE = 256;
              /** Edit mode: everything blinks and is locked; LMB = add slot, RMB = remove slot. */
              private boolean editing = false;

              public BagScreen(BagMenu menu, Inventory inventory, Component title) {
                  super(menu, inventory, title);
                  this.imageWidth = 176;
                  this.imageHeight = 222;
                  this.inventoryLabelY = this.imageHeight - 94;
              }

              private boolean isLocked(int slotIndex) {
                  return slotIndex < BagMenu.SIZE && !this.menu.isUnlocked(slotIndex);
              }

              @Override
              public void extractBackground(GuiGraphicsExtractor graphics, int mouseX, int mouseY, float delta) {
                  super.extractBackground(graphics, mouseX, mouseY, delta);
                  int x = this.leftPos;
                  int y = this.topPos;
                  graphics.fill(x, y, x + this.imageWidth, y + this.imageHeight, 0xFF000000);
                  graphics.fill(x + 1, y + 1, x + this.imageWidth - 1, y + this.imageHeight - 1, 0xFFC6C6C6);

                  for (int i = 0; i < this.menu.slots.size(); i++) {
                      Slot s = this.menu.slots.get(i);
                      int sx = x + s.x - 1;
                      int sy = y + s.y - 1;
                      graphics.fill(sx, sy, sx + 18, sy + 18, 0xFF373737);
                      graphics.fill(sx + 1, sy + 1, sx + 18, sy + 18, 0xFFFFFFFF);
                      graphics.fill(sx + 1, sy + 1, sx + 17, sy + 17, isLocked(i) ? 0xFF4A4A4A : 0xFF8B8B8B);
                  }
              }

              @Override
              public void extractRenderState(GuiGraphicsExtractor graphics, int mouseX, int mouseY, float delta) {
                  super.extractRenderState(graphics, mouseX, mouseY, delta);
                  if (!this.editing) {
                      return;
                  }
                  boolean bright = (System.currentTimeMillis() / 350L) % 2L == 0L;
                  int blink = bright ? 0x80FFE060 : 0x30FFE060;
                  for (int i = 0; i < this.menu.slots.size(); i++) {
                      Slot s = this.menu.slots.get(i);
                      int sx = this.leftPos + s.x;
                      int sy = this.topPos + s.y;
                      if (isLocked(i)) {
                          // green "+" on a locked slot: LMB adds it
                          graphics.fill(sx + 3, sy + 7, sx + 13, sy + 9, 0xFF55FF55);
                          graphics.fill(sx + 7, sy + 3, sx + 9, sy + 13, 0xFF55FF55);
                      } else {
                          graphics.fill(sx, sy, sx + 16, sy + 16, blink);
                      }
                  }
              }

              @Override
              public boolean mouseClicked(MouseButtonEvent event, boolean doubleClick) {
                  if (!this.editing) {
                      return super.mouseClicked(event, doubleClick);
                  }
                  Slot slot = this.getSlotUnderMouse();
                  if (slot != null) {
                      int idx = this.menu.slots.indexOf(slot);
                      if (idx >= 0 && idx < BagMenu.SIZE) {
                          boolean unlocked = this.menu.isUnlocked(idx);
                          if (event.button() == 0 && !unlocked) {
                              ClientPlayNetworking.send(new SlotEditPayload(idx, true));
                          } else if (event.button() == 1 && unlocked) {
                              ClientPlayNetworking.send(new SlotEditPayload(idx, false));
                          }
                      }
                  }
                  return true;
              }

              @Override
              public boolean keyPressed(KeyEvent event) {
                  if (BigBagClient.EDIT_KEY.matches(event)) {
                      if (this.editing) {
                          this.editing = false;
                      } else if (this.menu.getCarried().isEmpty()) {
                          this.editing = true;
                      }
                      return true;
                  }
                  if (BigBagClient.OPEN_KEY.matches(event)) {
                      this.onClose();
                      return true;
                  }
                  if (this.editing) {
                      if (event.key() == KEY_ESCAPE) {
                          this.editing = false;
                      }
                      return true;
                  }
                  return super.keyPressed(event);
              }
          }
          EOF

          mkdir -p src/main/java/com/bigbag/client
          cat > src/main/java/com/bigbag/client/BigBagClient.java <<'EOF'
          package com.bigbag.client;

          import com.bigbag.BigBagMod;
          import com.bigbag.OpenBagPayload;
          import com.mojang.blaze3d.platform.InputConstants;
          import net.fabricmc.api.ClientModInitializer;
          import net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientTickEvents;
          import net.fabricmc.fabric.api.client.keymapping.v1.KeyMappingHelper;
          import net.fabricmc.fabric.api.client.networking.v1.ClientPlayNetworking;
          import net.minecraft.client.KeyMapping;
          import net.minecraft.client.gui.screens.MenuScreens;

          public class BigBagClient implements ClientModInitializer {
              public static final KeyMapping.Category CATEGORY = KeyMapping.Category.register(BigBagMod.id("main"));
              public static KeyMapping OPEN_KEY;
              public static KeyMapping EDIT_KEY;

              @Override
              public void onInitializeClient() {
                  OPEN_KEY = KeyMappingHelper.registerKeyMapping(new KeyMapping(
                          "key.bigbag.open", InputConstants.Type.KEYSYM, InputConstants.KEY_B, CATEGORY));
                  EDIT_KEY = KeyMappingHelper.registerKeyMapping(new KeyMapping(
                          "key.bigbag.edit", InputConstants.Type.KEYSYM, InputConstants.KEY_G, CATEGORY));

                  MenuScreens.register(BigBagMod.BAG_MENU, BagScreen::new);

                  ClientTickEvents.END_CLIENT_TICK.register(client -> {
                      while (OPEN_KEY.consumeClick()) {
                          if (client.player != null) {
                              ClientPlayNetworking.send(new OpenBagPayload());
                          }
                      }
                  });
              }
          }
          EOF

          mkdir -p src/main/resources/assets/bigbag/lang
          cat > src/main/resources/assets/bigbag/lang/en_us.json <<'EOF'
          {
            "key.category.bigbag.main": "Big Bag",
            "key.bigbag.open": "Open bag",
            "key.bigbag.edit": "Edit slots (inside the bag)",
            "container.bigbag.bag": "Big Bag"
          }
          EOF

          mkdir -p src/main/resources/assets/bigbag/lang
          cat > src/main/resources/assets/bigbag/lang/ru_ru.json <<'EOF'
          {
            "key.category.bigbag.main": "Большой инвентарь",
            "key.bigbag.open": "Открыть инвентарь",
            "key.bigbag.edit": "Редактировать слоты (внутри инвентаря)",
            "container.bigbag.bag": "Большой инвентарь"
          }
          EOF

          mkdir -p src/main/resources
          cat > src/main/resources/fabric.mod.json <<'EOF'
          {
            "schemaVersion": 1,
            "id": "bigbag",
            "version": "${version}",
            "name": "Big Bag",
            "description": "Extra inventory slots. Press B to open the bag, G inside to add/remove slots.",
            "license": "MIT",
            "environment": "*",
            "entrypoints": {
              "main": ["com.bigbag.BigBagMod"],
              "client": ["com.bigbag.client.BigBagClient"]
            },
            "depends": {
              "fabricloader": ">=0.19.3",
              "minecraft": "~26.2",
              "java": ">=25",
              "fabric-api": "*"
            }
          }
          EOF


      - name: Build
        run: gradle build --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: bigbag-jar
          path: build/libs/*.jar
