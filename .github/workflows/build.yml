name: build

# Самодостаточный workflow: весь код мода встроен в этот файл.
# Положите его в .github/workflows/build.yml пустого репозитория и запустите (Actions -> build -> Run workflow).
#
# Этап 2: режим правки раскладки (хоткей G):
#   - все слоты мигают, обычным инвентарём пользоваться нельзя;
#   - Shift + зацепить правый край мышкой и тянуть вправо = добавлять вертикальные колонки (3 слота инвентаря + 1 хотбара);
#   - ПКМ по добавленному слоту = удалить слот (ПКМ по удалённому = вернуть);
#   - ЛКМ = подтвердить (сервер проверяет и подтверждает); Esc = отмена.
# Реальные слоты в инвентаре (миксины) появятся на этапе 3, для него нужен артефакт mc-sources (галочка inspect).

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      inspect:
        description: 'Выгрузить исходники Minecraft (нужно для миксинов)'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.7.0

      - name: Generate mod project
        run: |
          cat > 'gradle.properties' <<'BIGINV_EOF'
          org.gradle.jvmargs=-Xmx2G
          org.gradle.parallel=true
          org.gradle.configuration-cache=false

          # Fabric (https://fabricmc.net/develop)
          minecraft_version=26.2
          loader_version=0.19.5
          loom_version=1.18.4
          fabric_api_version=0.161.0+26.2

          # Мод
          mod_version=0.2.0
          maven_group=com.biginventory
          archives_base_name=biginventory
          BIGINV_EOF
          cat > 'settings.gradle' <<'BIGINV_EOF'
          pluginManagement {
              repositories {
                  maven {
                      name = 'Fabric'
                      url = 'https://maven.fabricmc.net/'
                  }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          BIGINV_EOF
          cat > 'build.gradle' <<'BIGINV_EOF'
          plugins {
              id 'net.fabricmc.fabric-loom' version "${loom_version}"
              id 'maven-publish'
          }

          version = project.mod_version
          group = project.maven_group

          base {
              archivesName = project.archives_base_name
          }

          repositories {
          }

          loom {
              splitEnvironmentSourceSets()

              mods {
                  "biginventory" {
                      sourceSet sourceSets.main
                      sourceSet sourceSets.client
                  }
              }
          }

          dependencies {
              // Minecraft 26.x не обфусцирован: маппинги и remap не нужны
              minecraft "com.mojang:minecraft:${project.minecraft_version}"
              implementation "net.fabricmc:fabric-loader:${project.loader_version}"
              implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
          }

          processResources {
              inputs.property "version", project.version

              filesMatching("fabric.mod.json") {
                  expand "version": inputs.properties.version
              }
          }

          tasks.withType(JavaCompile).configureEach {
              it.options.release = 25
              it.options.encoding = "UTF-8"
          }

          java {
              withSourcesJar()
              sourceCompatibility = JavaVersion.VERSION_25
              targetCompatibility = JavaVersion.VERSION_25
          }
          BIGINV_EOF
          mkdir -p 'src/main/java/com/biginventory'
          cat > 'src/main/java/com/biginventory/BigInventory.java' <<'BIGINV_EOF'
          package com.biginventory;

          import net.fabricmc.api.ModInitializer;
          import net.fabricmc.fabric.api.networking.v1.PayloadTypeRegistry;
          import net.minecraft.resources.Identifier;

          public class BigInventory implements ModInitializer {
              public static final String MOD_ID = "biginventory";

              /** Максимум дополнительных колонок. */
              public static final int MAX_COLUMNS = 6;

              /** В одной колонке: 3 слота инвентаря + 1 слот хотбара. */
              public static final int ROWS = 4;

              public static Identifier id(String path) {
                  return Identifier.fromNamespaceAndPath(MOD_ID, path);
              }

              /** Битовая маска, в которой единицы стоят на всех существующих добавленных слотах (до 24 бит). */
              public static int validMask(int columns) {
                  int slots = Math.max(0, Math.min(MAX_COLUMNS, columns)) * ROWS;
                  return (1 << slots) - 1;
              }

              @Override
              public void onInitialize() {
                  PayloadTypeRegistry.serverboundPlay().register(LayoutPayload.TYPE, LayoutPayload.CODEC);
                  PayloadTypeRegistry.clientboundPlay().register(LayoutPayload.TYPE, LayoutPayload.CODEC);
                  LayoutState.register();
              }
          }
          BIGINV_EOF
          cat > 'src/main/java/com/biginventory/LayoutPayload.java' <<'BIGINV_EOF'
          package com.biginventory;

          import net.minecraft.network.RegistryFriendlyByteBuf;
          import net.minecraft.network.codec.ByteBufCodecs;
          import net.minecraft.network.codec.StreamCodec;
          import net.minecraft.network.protocol.common.custom.CustomPacketPayload;

          /**
           * Раскладка добавленных слотов.
           * Клиент -> сервер: "хочу вот так" (по ЛКМ в режиме правки).
           * Сервер -> клиент: "принято вот так" (после проверки лимитов).
           *
           * @param columns     сколько дополнительных колонок
           * @param removedMask бит N = 1, если добавленный слот N удалён (номер = колонка * 4 + строка)
           */
          public record LayoutPayload(int columns, int removedMask) implements CustomPacketPayload {

              public static final CustomPacketPayload.Type<LayoutPayload> TYPE =
                      new CustomPacketPayload.Type<>(BigInventory.id("layout"));

              public static final StreamCodec<RegistryFriendlyByteBuf, LayoutPayload> CODEC = StreamCodec.composite(
                      ByteBufCodecs.VAR_INT, LayoutPayload::columns,
                      ByteBufCodecs.VAR_INT, LayoutPayload::removedMask,
                      LayoutPayload::new);

              @Override
              public CustomPacketPayload.Type<? extends CustomPacketPayload> type() {
                  return TYPE;
              }
          }
          BIGINV_EOF
          cat > 'src/main/java/com/biginventory/LayoutState.java' <<'BIGINV_EOF'
          package com.biginventory;

          import java.util.HashMap;
          import java.util.Map;
          import java.util.UUID;
          import net.fabricmc.fabric.api.event.lifecycle.v1.ServerLifecycleEvents;
          import net.fabricmc.fabric.api.networking.v1.ServerPlayNetworking;

          /**
           * Серверная сторона: раскладка каждого игрока. Клиенту верить нельзя, поэтому всё проверяется здесь:
           * число колонок ограничено, а биты удалённых слотов за пределами колонок сбрасываются.
           * (Пока хранится только в памяти; сохранение вместе с данными игрока - на этапе 3.)
           */
          public final class LayoutState {
              public record Layout(int columns, int removedMask) {
              }

              private static final Map<UUID, Layout> LAYOUTS = new HashMap<>();

              private LayoutState() {
              }

              public static Layout get(UUID player) {
                  return LAYOUTS.getOrDefault(player, new Layout(0, 0));
              }

              public static void register() {
                  ServerPlayNetworking.registerGlobalReceiver(LayoutPayload.TYPE, (payload, context) -> {
                      int columns = Math.max(0, Math.min(BigInventory.MAX_COLUMNS, payload.columns()));
                      int mask = payload.removedMask() & BigInventory.validMask(columns);
                      LAYOUTS.put(context.player().getUUID(), new Layout(columns, mask));
                      ServerPlayNetworking.send(context.player(), new LayoutPayload(columns, mask));
                  });

                  ServerLifecycleEvents.SERVER_STOPPED.register(server -> LAYOUTS.clear());
              }
          }
          BIGINV_EOF
          mkdir -p 'src/client/java/com/biginventory/client'
          cat > 'src/client/java/com/biginventory/client/BigInventoryClient.java' <<'BIGINV_EOF'
          package com.biginventory.client;

          import com.biginventory.BigInventory;
          import com.biginventory.LayoutPayload;
          import com.mojang.blaze3d.platform.InputConstants;
          import net.fabricmc.api.ClientModInitializer;
          import net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientTickEvents;
          import net.fabricmc.fabric.api.client.keymapping.v1.KeyMappingHelper;
          import net.fabricmc.fabric.api.client.networking.v1.ClientPlayConnectionEvents;
          import net.fabricmc.fabric.api.client.networking.v1.ClientPlayNetworking;
          import net.minecraft.client.KeyMapping;
          import org.lwjgl.glfw.GLFW;

          public class BigInventoryClient implements ClientModInitializer {
              private static KeyMapping openKey;

              /** Что подтвердил сервер. */
              public static int confirmedColumns = 0;
              public static int confirmedMask = 0;

              /** Сохраняет раскладку и отправляет её на сервер. */
              public static void requestLayout(int columns, int removedMask) {
                  ClientConfig.columns = columns;
                  ClientConfig.removedMask = removedMask;
                  ClientConfig.save();
                  if (ClientPlayNetworking.canSend(LayoutPayload.TYPE)) {
                      ClientPlayNetworking.send(new LayoutPayload(columns, removedMask));
                  }
              }

              @Override
              public void onInitializeClient() {
                  ClientConfig.load();

                  KeyMapping.Category category = KeyMapping.Category.register(BigInventory.id("main"));

                  openKey = KeyMappingHelper.registerKeyMapping(new KeyMapping(
                          "key.biginventory.open",
                          InputConstants.Type.KEYSYM,
                          GLFW.GLFW_KEY_G,
                          category));

                  ClientPlayNetworking.registerGlobalReceiver(LayoutPayload.TYPE, (payload, context) -> {
                      confirmedColumns = payload.columns();
                      confirmedMask = payload.removedMask();
                  });

                  // При входе в мир сервер ничего не знает о наших настройках - отправляем.
                  ClientPlayConnectionEvents.JOIN.register((handler, sender, client) ->
                          requestLayout(ClientConfig.columns, ClientConfig.removedMask));

                  ClientTickEvents.END_CLIENT_TICK.register(client -> {
                      if (client.player == null) {
                          return;
                      }
                      while (openKey.consumeClick()) {
                          if (client.gui.screen() == null) {
                              client.gui.setScreen(new LayoutScreen());
                          }
                      }
                  });
              }
          }
          BIGINV_EOF
          cat > 'src/client/java/com/biginventory/client/LayoutScreen.java' <<'BIGINV_EOF'
          package com.biginventory.client;

          import com.biginventory.BigInventory;
          import net.minecraft.client.gui.GuiGraphicsExtractor;
          import net.minecraft.client.gui.screens.Screen;
          import net.minecraft.client.input.MouseButtonEvent;
          import net.minecraft.network.chat.Component;

          /**
           * Режим правки раскладки. Рисует сетку слотов (мигающую) вместо обычного инвентаря, поэтому
           * пользоваться предметами в нём нельзя.
           *
           * Управление:
           *  - Shift + ЛКМ по правому краю и тянуть вправо/влево: добавить/убрать колонки;
           *  - ПКМ по добавленному слоту: удалить слот (повторно: вернуть);
           *  - ЛКМ: подтвердить и отправить на сервер;
           *  - Esc: отмена.
           */
          public class LayoutScreen extends Screen {
              private static final int CELL = 18;
              private static final int BASE_COLS = 9;
              private static final int ROWS = BigInventory.ROWS;

              private int workCols;
              private int workMask;
              private boolean dragging;

              public LayoutScreen() {
                  super(Component.translatable("biginventory.menu.title"));
                  this.workCols = Math.min(ClientConfig.columns, BigInventory.MAX_COLUMNS);
                  this.workMask = ClientConfig.removedMask & BigInventory.validMask(this.workCols);
              }

              // ---------- геометрия ----------

              /** Левый край сетки: ванильные 9 колонок по центру, добавленные растут вправо (чтобы край не "убегал" от мыши). */
              private int gridLeft() {
                  return (this.width - BASE_COLS * CELL) / 2;
              }

              private int gridTop() {
                  return this.height / 2 - 40;
              }

              /** Строки 0..2 - инвентарь, строка 3 - хотбар (отделён зазором 4 px). */
              private int rowY(int row) {
                  return gridTop() + row * CELL + (row == ROWS - 1 ? 4 : 0);
              }

              private int colX(int col) {
                  return gridLeft() + col * CELL;
              }

              private int edgeX() {
                  return colX(BASE_COLS + this.workCols);
              }

              private static int slotId(int col, int row) {
                  return (col - BASE_COLS) * ROWS + row;
              }

              private boolean isRemoved(int id) {
                  return (this.workMask & (1 << id)) != 0;
              }

              private boolean onHandle(double mx, double my) {
                  return mx >= edgeX() - 3 && mx <= edgeX() + 9
                          && my >= rowY(0) && my <= rowY(ROWS - 1) + CELL;
              }

              private void setColumns(int columns) {
                  this.workCols = Math.max(0, Math.min(BigInventory.MAX_COLUMNS, columns));
                  // удалённые слоты в убранных колонках больше не существуют
                  this.workMask &= BigInventory.validMask(this.workCols);
              }

              private void toggleSlotAt(double mx, double my) {
                  for (int col = BASE_COLS; col < BASE_COLS + this.workCols; col++) {
                      for (int row = 0; row < ROWS; row++) {
                          int x = colX(col);
                          int y = rowY(row);
                          if (mx >= x && mx < x + CELL && my >= y && my < y + CELL) {
                              this.workMask ^= 1 << slotId(col, row);
                              return;
                          }
                      }
                  }
              }

              // ---------- ввод ----------

              @Override
              public boolean mouseClicked(MouseButtonEvent event, boolean doubleClick) {
                  double mx = event.x();
                  double my = event.y();
                  int button = event.button();

                  if (button == 0) {
                      if (event.hasShiftDown() && onHandle(mx, my)) {
                          this.dragging = true; // начали растягивать: это ещё не подтверждение
                          return true;
                      }
                      BigInventoryClient.requestLayout(this.workCols, this.workMask);
                      this.onClose();
                      return true;
                  }
                  if (button == 1) {
                      toggleSlotAt(mx, my);
                      return true;
                  }
                  return super.mouseClicked(event, doubleClick);
              }

              @Override
              public boolean mouseDragged(MouseButtonEvent event, double dragX, double dragY) {
                  if (this.dragging) {
                      int columns = (int) Math.round((event.x() - gridLeft()) / (double) CELL) - BASE_COLS;
                      setColumns(columns);
                      return true;
                  }
                  return super.mouseDragged(event, dragX, dragY);
              }

              @Override
              public boolean mouseReleased(MouseButtonEvent event) {
                  if (this.dragging) {
                      this.dragging = false;
                      return true;
                  }
                  return super.mouseReleased(event);
              }

              // ---------- отрисовка ----------

              @Override
              public void extractRenderState(GuiGraphicsExtractor graphics, int mouseX, int mouseY, float delta) {
                  super.extractRenderState(graphics, mouseX, mouseY, delta);

                  float pulse = 0.5f + 0.5f * (float) Math.sin(System.currentTimeMillis() / 200.0);
                  int glow = ((int) (90 + pulse * 165) << 24) | 0xFFFFFF; // мигание добавленных слотов
                  int dim = ((int) (30 + pulse * 70) << 24) | 0xFFFFFF;   // мигание обычных слотов

                  for (int row = 0; row < ROWS; row++) {
                      for (int col = 0; col < BASE_COLS + this.workCols; col++) {
                          int x = colX(col);
                          int y = rowY(row);
                          boolean extra = col >= BASE_COLS;
                          boolean removed = extra && isRemoved(slotId(col, row));
                          boolean hovered = extra && mouseX >= x && mouseX < x + CELL && mouseY >= y && mouseY < y + CELL;

                          int border = removed ? 0xFFAA3333 : (extra ? glow : dim);
                          int inner = removed ? 0xFF3A1010 : (hovered ? 0xFF505050 : 0xFF373737);

                          graphics.fill(x, y, x + CELL, y + CELL, border);
                          graphics.fill(x + 1, y + 1, x + CELL - 1, y + CELL - 1, inner);
                          if (removed) {
                              drawCentered(graphics, "x", x + CELL / 2, y + 5, 0xFFFF5555);
                          }
                      }
                  }

                  // ручка для растягивания у правого края
                  int hx = edgeX() + 1;
                  graphics.fill(hx, rowY(0), hx + 4, rowY(ROWS - 1) + CELL, this.dragging ? 0xFFFFFF55 : glow);

                  int cx = this.width / 2;
                  drawCentered(graphics, this.title.getString(), cx, gridTop() - 28, 0xFFFFFFFF);
                  drawCentered(graphics, Component.translatable("biginventory.menu.info", this.workCols,
                          this.workCols * ROWS - Integer.bitCount(this.workMask)).getString(),
                          cx, gridTop() - 14, 0xFFFFFFFF);

                  int below = rowY(ROWS - 1) + CELL + 12;
                  drawCentered(graphics, Component.translatable("biginventory.menu.hint1").getString(), cx, below, 0xFFA0A0A0);
                  drawCentered(graphics, Component.translatable("biginventory.menu.hint2").getString(), cx, below + 12, 0xFFA0A0A0);
                  drawCentered(graphics, Component.translatable("biginventory.menu.hint3").getString(), cx, below + 24, 0xFFA0A0A0);
              }

              private void drawCentered(GuiGraphicsExtractor graphics, String text, int centerX, int y, int color) {
                  graphics.text(this.font, text, centerX - this.font.width(text) / 2, y, color, true);
              }
          }
          BIGINV_EOF
          cat > 'src/client/java/com/biginventory/client/ClientConfig.java' <<'BIGINV_EOF'
          package com.biginventory.client;

          import java.io.IOException;
          import java.io.Reader;
          import java.io.Writer;
          import java.nio.file.Files;
          import java.nio.file.Path;
          import java.util.Properties;
          import net.fabricmc.loader.api.FabricLoader;

          /** Настройки игрока на клиенте: файл config/biginventory.properties. */
          public final class ClientConfig {
              public static int columns = 0;
              public static int removedMask = 0;

              private ClientConfig() {
              }

              private static Path file() {
                  return FabricLoader.getInstance().getConfigDir().resolve("biginventory.properties");
              }

              public static void load() {
                  Path path = file();
                  if (!Files.exists(path)) {
                      return;
                  }
                  Properties props = new Properties();
                  try (Reader reader = Files.newBufferedReader(path)) {
                      props.load(reader);
                  } catch (IOException e) {
                      return;
                  }
                  try {
                      columns = Math.max(0, Integer.parseInt(props.getProperty("columns", "0").trim()));
                      removedMask = Math.max(0, Integer.parseInt(props.getProperty("removedMask", "0").trim()));
                  } catch (NumberFormatException e) {
                      columns = 0;
                      removedMask = 0;
                  }
              }

              public static void save() {
                  Properties props = new Properties();
                  props.setProperty("columns", Integer.toString(columns));
                  props.setProperty("removedMask", Integer.toString(removedMask));
                  try (Writer writer = Files.newBufferedWriter(file())) {
                      props.store(writer, "Bigger Inventory");
                  } catch (IOException e) {
                      // не критично: настройки просто не сохранятся на диск
                  }
              }
          }
          BIGINV_EOF
          mkdir -p 'src/main/resources/assets/biginventory/lang'
          cat > 'src/main/resources/assets/biginventory/lang/en_us.json' <<'BIGINV_EOF'
          {
            "key.biginventory.open": "Edit inventory layout",
            "key.category.biginventory.main": "Bigger Inventory",

            "biginventory.menu.title": "Inventory Layout",
            "biginventory.menu.info": "Extra columns: %s, extra slots: %s",
            "biginventory.menu.hint1": "Shift + drag the right edge: add or remove columns",
            "biginventory.menu.hint2": "Right click a slot: remove / restore it",
            "biginventory.menu.hint3": "Left click: confirm   Esc: cancel"
          }
          BIGINV_EOF
          cat > 'src/main/resources/assets/biginventory/lang/ru_ru.json' <<'BIGINV_EOF'
          {
            "key.biginventory.open": "Править раскладку инвентаря",
            "key.category.biginventory.main": "Bigger Inventory",

            "biginventory.menu.title": "Раскладка инвентаря",
            "biginventory.menu.info": "Доп. колонок: %s, доп. слотов: %s",
            "biginventory.menu.hint1": "Shift + тянуть правый край: добавить или убрать колонки",
            "biginventory.menu.hint2": "ПКМ по слоту: удалить / вернуть слот",
            "biginventory.menu.hint3": "ЛКМ: подтвердить   Esc: отмена"
          }
          BIGINV_EOF
          cat > 'src/main/resources/fabric.mod.json' <<'BIGINV_EOF'
          {
            "schemaVersion": 1,
            "id": "biginventory",
            "version": "${version}",
            "name": "Bigger Inventory",
            "description": "Больше слотов в инвентаре и хотбаре: колонки добавляются по хоткею.",
            "authors": [],
            "license": "MIT",
            "environment": "*",
            "entrypoints": {
              "main": [
                "com.biginventory.BigInventory"
              ],
              "client": [
                "com.biginventory.client.BigInventoryClient"
              ]
            },
            "depends": {
              "fabricloader": ">=0.19.3",
              "minecraft": "~26.2",
              "java": ">=25",
              "fabric-api": "*"
            }
          }
          BIGINV_EOF

      - name: Build
        run: gradle build --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: biginventory
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar

      # Выгрузка исходников нужных классов Minecraft (только при ручном запуске с галочкой inspect).
      # Выполняется, даже если сборка выше упала, и сама сборку не ломает.
      - name: Dump Minecraft sources (for writing mixins)
        if: ${{ always() && inputs.inspect }}
        continue-on-error: true
        timeout-minutes: 40
        run: |
          gradle genSources --stacktrace
          mkdir -p inspect/src
          SRC=$(find "$HOME/.gradle" .gradle -name '*sources*.jar' 2>/dev/null | grep -i minecraft | head -n 6)
          echo "Sources jars found:"
          echo "$SRC"
          for jar in $SRC; do
            unzip -o -q "$jar" -d inspect/src || true
          done

          OUT=inspect/mc-sources.txt
          : > "$OUT"

          # Целиком
          for f in \
            net/minecraft/world/entity/player/Inventory \
            net/minecraft/world/inventory/InventoryMenu \
            net/minecraft/world/inventory/Slot \
            net/minecraft/world/inventory/ChestMenu \
            net/minecraft/network/protocol/game/ServerboundSetCarriedItemPacket \
            net/minecraft/client/input/MouseButtonEvent \
            net/minecraft/client/input/InputWithModifiers ; do
            p=$(find inspect/src -path "*/$f.java" | head -n 1)
            if [ -n "$p" ]; then
              { echo "=== $f ==="; cat "$p"; echo; } >> "$OUT"
            else
              echo "=== $f: NOT FOUND ===" >> "$OUT"
            fi
          done

          # Только места про хотбар / выбранный слот / колесо / отрисовку слотов / мышь
          for f in \
            net/minecraft/client/gui/Gui \
            net/minecraft/client/gui/screens/inventory/AbstractContainerScreen \
            net/minecraft/client/gui/screens/inventory/InventoryScreen \
            net/minecraft/client/MouseHandler ; do
            p=$(find inspect/src -path "*/$f.java" | head -n 1)
            if [ -n "$p" ]; then
              { echo "=== $f (filtered) ==="; grep -n -i -B2 -A10 -E 'hotbar|selected|scroll|renderSlot|SLOT' "$p"; echo; } >> "$OUT"
            else
              echo "=== $f: NOT FOUND ===" >> "$OUT"
            fi
          done

          # Сигнатуры методов экрана и отрисовки (для правки LayoutScreen, если сборка не пройдёт)
          for f in \
            net/minecraft/client/gui/screens/Screen \
            net/minecraft/client/gui/GuiGraphicsExtractor ; do
            p=$(find inspect/src -path "*/$f.java" | head -n 1)
            if [ -n "$p" ]; then
              { echo "=== $f (signatures) ==="; grep -n -E 'public .*\(' "$p" | grep -i -E 'mouse|key|shift|fill|text|outline|blit|extract|pause'; echo; } >> "$OUT"
            else
              echo "=== $f: NOT FOUND ===" >> "$OUT"
            fi
          done

          wc -l "$OUT"

      - name: Upload source dump
        if: ${{ always() && inputs.inspect }}
        uses: actions/upload-artifact@v4
        with:
          name: mc-sources
          path: inspect/mc-sources.txt
          if-no-files-found: ignore

      # При пуше тега вида v1.0.0 jar прикрепляется к GitHub Release
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/libs/*.jar
            !build/libs/*-sources.jar
